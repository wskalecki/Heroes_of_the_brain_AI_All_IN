[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wachta"
version = "0.1.0"
description = "Fatigue and vigilance monitoring from EEG (Heroes of the Brain 2026)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "mne>=1.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# Live acquisition through BrainAccess Board (needs the Board app and the headset).
live = ["brainaccess-board>=1.0.3"]
analysis = ["pandas>=2.0", "matplotlib>=3.8", "fitdecode>=0.10"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wachta = ["web/*", "pvt.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test-*.py"]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
