name: Etykiety strumieni

# Labels pull requests by the files they touch (A sygnał, B dane, C pomiary, D pitch, docs, ci),
# so it is obvious whose stream a change belongs to. Mapping: .github/labeler.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
